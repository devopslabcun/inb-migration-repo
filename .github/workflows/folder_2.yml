name: Build
on:
  push:
    branches:
      - merge_requests
      - development
    paths:
      - 'folder_2/**/*'
      - '.github/workflows/folder_2.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'folder_2/**/*'
      - '.github/workflows/folder_2.yml'
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with: 
          projectBaseDir: ./folder_2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FOLDER2 }}
          SONAR_WORKING_DIRECTORY: ./folder_2
